<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NTE240 — Интерактивный каталог запасных частей</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="contact-bar">
  <span class="ctext">По вопросам работы каталога запасных частей, ошибок и замечаний обращаться к&nbsp;Кузнецову&nbsp;В.Е.</span>
  <a class="cmail" href="mailto:KuznetsovVE@industrservice.ru">KuznetsovVE@industrservice.ru</a>
</div>

<header class="app">
  <button class="menu-btn" id="menuBtn" aria-label="Меню">☰</button>
  <div class="logo">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 196 196" width="30" height="30"><path d="M63.5941 165.078 114.786 64.5721 99.6758 31 83.5127 31 16 165.078 63.5941 165.078Z"/><path d="M107.608 118.291 152.342 118.291 179.684 64.5721 164.574 31 119.559 31 134.669 64.5721 107.608 118.291Z"/></svg>
    </span>
    <div class="title">
      <div class="t1">Развитие · Каталог запчастей</div>
      <div class="t2">NTE240 · электромеханический самосвал NHL</div>
    </div>
  </div>
  <div class="search">
    <input id="search" type="search" placeholder="Поиск по номеру детали или названию…" autocomplete="off">
    <span class="ico">⌕</span>
  </div>
  <span class="spacer"></span>
  <a class="manual-btn" href="service.html">🔧 Ремонт и обслуживание</a>
  <a class="manual-btn" href="manual.html">📘 Руководство по эксплуатации</a>
  <button class="cart-btn" id="cartBtn">
    <span>Заказ</span>
    <span class="count" id="cartCount">0</span>
  </button>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-tools">
      <button id="exportAll">⬇ Экспорт всех номеров (Excel)</button>
    </div>
    <div id="chapters"></div>
  </nav>
  <main class="content" id="content"></main>
</div>

<!-- cart -->
<div class="overlay" id="overlay"></div>
<aside class="cart" id="cart">
  <div class="cart-h">
    <h2>Заказ-спецификация</h2>
    <button class="close" id="cartClose" aria-label="Закрыть">×</button>
  </div>
  <div class="cart-serial">
    <label for="serial">Заводской / серийный номер машины</label>
    <input id="serial" type="text" placeholder="напр. NTE240A001">
  </div>
  <div class="cart-lines" id="cartLines"></div>
  <div class="cart-foot">
    <div class="total"><span>Итого</span><span id="cartTotal">0.00 CNY</span></div>
    <div class="note" id="cartNote"></div>
    <div class="acts">
      <button class="btn primary" id="exportCsv">Экспорт Excel</button>
      <button class="btn" id="printOrder">Печать</button>
      <button class="btn ghost" id="clearCart">Очистить</button>
    </div>
  </div>
</aside>

<!-- lightbox -->
<div class="lightbox" id="lightbox"><span class="x" id="lbClose">×</span><img id="lbImg" alt=""></div>
<div class="toast" id="toast"></div>

<script src="data/parts.js"></script>
<script src="data/prices.js"></script>
<script src="data/service.js"></script>
<script src="app.js"></script>
</body>
</html>
